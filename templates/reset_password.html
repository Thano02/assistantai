{% extends "base_public.html" %}
{% block title %}Nouveau mot de passe — AssistantAI{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 flex items-center justify-center py-12 px-4">
  <div class="max-w-md w-full">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900">Nouveau mot de passe</h1>
      <p class="text-gray-500 mt-2">Choisissez un mot de passe sécurisé</p>
    </div>
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
      {% if error %}
      <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-6 text-sm">
        {{ error }}
      </div>
      <div class="text-center">
        <a href="/auth/forgot-password" class="text-primary font-medium hover:underline text-sm">
          Faire une nouvelle demande
        </a>
      </div>
      {% else %}
      <form method="post" action="/auth/reset-password/{{ token }}" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Nouveau mot de passe</label>
          <input type="password" name="password" required autocomplete="new-password" minlength="8"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
            placeholder="8 caractères minimum">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Confirmer le mot de passe</label>
          <input type="password" name="confirm_password" required autocomplete="new-password" minlength="8"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
            placeholder="••••••••">
        </div>
        <button type="submit"
          class="w-full bg-primary hover:bg-blue-700 text-white py-3 rounded-lg font-semibold transition-colors">
          Modifier mon mot de passe
        </button>
      </form>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
